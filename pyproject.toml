[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contravecc-ambiguity"
version = "0.1.0"
description = "找出题干中缺少限定、允许多种答案的表述，标出歧义位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "contravecc" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://contravecc.github.io"
Repository = "https://github.com/contravecc/ambiguity"
Issues = "https://github.com/contravecc/ambiguity/issues"

[project.scripts]
ambiguity = "ambiguity:main"

[tool.setuptools]
py-modules = ["ambiguity"]
